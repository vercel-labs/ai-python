name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - uses: astral-sh/setup-uv@v5

      - run: uv sync

      - run: uv run ruff format --check src tests examples
      - run: uv run ruff check src tests examples
      - run: uv run mypy src tests
      - run: uv run ty check

      - run: uv run pytest

      - run: uv run examples/.test_scripts/check-examples.py

  provider-sdk-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - sdk-versions: minimum
            openai: openai==2.34.0
            anthropic: anthropic==0.83.0
            claude-agent-sdk: claude-agent-sdk==0.2.144
          - sdk-versions: latest
            openai: openai>=2.34.0,<4.0.0
            anthropic: anthropic>=0.83.0,<2.0.0
            claude-agent-sdk: claude-agent-sdk>=0.2.144,<0.3
    name: Provider SDKs (${{ matrix.sdk-versions }})
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5

      - run: uv sync

      - name: Install ${{ matrix.sdk-versions }} provider SDKs
        run: >-
          uv pip install --upgrade
          '${{ matrix.openai }}'
          '${{ matrix.anthropic }}'
          '${{ matrix.claude-agent-sdk }}'

      - run: uv run --no-sync mypy src tests
      - run: uv run --no-sync ty check
      - run: >-
          uv run --no-sync pytest
          tests/providers/openai
          tests/providers/anthropic
          tests/harnesses

  no-extras:
    # `pip install ai` with no extras: the harness and sandbox pieces must
    # import, and fail with InstallationError when built, not on first use.
    runs-on: ubuntu-latest
    name: Without optional extras
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5

      - run: uv sync --no-default-groups

      - run: uv pip install pytest

      - run: >-
          uv run --no-sync pytest
          tests/harnesses/experimental/test_extras.py
          tests/workspaces/experimental/test_extras.py
