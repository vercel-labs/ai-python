[project]
name = "ai"
dynamic = ["version"]
description = "AI Agent Framework for Python"
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
authors = [
    { name = "Andrey Buzin", email = "andrey.buzin@vercel.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python",
    "Topic :: Internet",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
requires-python = ">=3.12"
dependencies = [
    "httpx2>=2.12.0",
    "modelsdotdev==0.*",
    "pydantic>=2.13",
    "typing-extensions>=4.15.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.83.0,<2.0.0"]
# the ceiling guards the private claude_agent_sdk imports in
# ai.harnesses.experimental._adapters.remote_cli
claude-code = ["claude-agent-sdk>=0.2.144,<0.3"]
mcp = ["mcp>=2.0.0,<3.0.0"]
openai = ["openai>=2.34.0,<4.0.0"]
# TODO(vercel-py#415): set the floor to the first release that includes it.
# Until then the dev group pins the tested commit from git.
sandbox = ["vercel-sandbox"]
otel = [
    "opentelemetry-exporter-otlp-proto-http>=1.30",
    "opentelemetry-sdk>=1.30",
]
vercel = [
    "vercel-oidc>=0.8.0",
]

[project.urls]
Homepage = "https://ai-python.dev"
Repository = "https://github.com/vercel-labs/ai-python"
Issues = "https://github.com/vercel-labs/ai-python/issues"
Changelog = "https://github.com/vercel-labs/ai-python/releases"

[build-system]
requires = ["hatchling", "uv-dynamic-versioning>=0.7.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
bump = true

[dependency-groups]
dev = [
    "anthropic>=0.83.0",
    "claude-agent-sdk>=0.2.144,<0.3",
    "mcp>=2.0.0,<3.0.0",
    "python-dotenv>=1.2.1",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "rich>=14.2.0",
    "mypy~=2.1.0",
    "openai>=2.14.0",
    "ruff~=0.8.0",
    "async-solipsism>=0.9",
    "ty~=0.0.37",
    "vercel-oidc>=0.8.0",
    "opentelemetry-sdk>=1.43.0",
    "opentelemetry-exporter-otlp-proto-http>=1.43.0",
    # vercel/vercel-py#415 (interactive PTY) is merged to main but not
    # released yet. uv.lock pins the commit; re-locking picks up main, which
    # needs a `pytest -m sandbox` run. Its sibling packages come from the same
    # main: vercel-sandbox on main needs unreleased vercel-internal-core.
    "vercel-sandbox @ git+https://github.com/vercel/vercel-py@main#subdirectory=src/vercel-sandbox",
    "vercel-internal-core @ git+https://github.com/vercel/vercel-py@main#subdirectory=src/vercel-internal-core",
    "vercel-oidc @ git+https://github.com/vercel/vercel-py@main#subdirectory=src/vercel-oidc",
    "pytest-timeout>=2.3",
]

[tool.uv]
default-groups = ["dev"]
exclude-newer = "2 days"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests", "examples"]
exclude = [
    "examples/apps/web_agent/backend/main.py",
    # depends on the vercel package, which is not part of this project's env
    "examples/apps/durable_agent_workflows/",
    # depends on slack-bolt, which is not part of this project's env
    "examples/apps/slack_agent/",
]

[tool.ty.environment]
python-version = "3.12"
root = ["./src", "./"]

[tool.ty.src]
exclude = [
    "examples/",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Live harness tests drive real agent CLIs and sandboxes, so they are opt-in:
# `uv run pytest -m live tests/harnesses` (a later -m overrides this one).
addopts = "-m 'not live and not sandbox'"
# The harness live suite drives real agents; hanging must be a failure.
timeout = 300
markers = [
    "live: drives a real local harness installation (deselect with -m 'not live')",
    "sandbox: needs Vercel Sandbox credentials (deselect with -m 'not sandbox')",
    "slow: multi-turn or multi-process; minutes, not seconds",
]
filterwarnings = [
    "ignore:'asyncio\\.DefaultEventLoopPolicy' is deprecated.*:DeprecationWarning:async_solipsism\\.loop",
]

[tool.ruff]
line-length = 80
indent-width = 4
target-version = "py312"
src = ["src"]
exclude = [
    ".github",
    ".git",
    "build",
    "dist",
    ".eggs",
]

[tool.ruff.lint]
preview = true
extend-select = [
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "D",    # pydocstyle
    "E",    # error
    "ERA",  # flake8-eradicate
    "F",    # pyflakes
    "FBT",  # flake8-boolean-trap
    "G",    # flake8-logging-format
    "I",    # isort
    "N",    # pep8-naming
    "PGH",  # pygrep-hooks
    "PIE",  # flake8-pie
    "PLE",  # pylint-error
    "PLW",  # pylint-warning
    "PLC0415",  # pylint-convention: import not at top of file
    "PLC2701",  # pylint-convention: private import
    "RUF",  # ruff specific
    "T20",  # flake8-print
    "TC",   # flake8-type-checking
    "UP",   # pyupgrade
    "W",    # warning
]

extend-ignore = [
    "D100",    # public API docs are not yet enforced everywhere
    "D101",    # public API docs are not yet enforced everywhere
    "D102",    # public API docs are not yet enforced everywhere
    "D103",    # public API docs are not yet enforced everywhere
    "D104",    # public API docs are not yet enforced everywhere
    "D105",    # public API docs are not yet enforced everywhere
    "D107",    # public API docs are not yet enforced everywhere
    "D417",    # public API docs are not yet enforced everywhere
    "D203",    # incorrect-blank-line-before-class
    "D213",    # multi-line-summary-second-line
    "F541",    # f-string-missing-placeholders
    "PLW1514", # unspecified-encoding (UTF-8 is Python 3 default)
    "PLW2901", # redefined-loop-name (intentional pattern for line processing)
    "RUF029",  # async generators/protocol hooks may not need an await
]

[tool.ruff.lint.flake8-type-checking]
# pydantic evaluates field annotations at runtime, so their imports must stay
# real even under `from __future__ import annotations`
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

[tool.ruff.lint.per-file-ignores]
"examples/**/*.py" = [
    "D",       # examples are executable samples, not public API
    "PLW1510", # example subprocess helpers intentionally handle failures manually
    "RUF029",  # example async tools often demonstrate async entry points
    "T201",    # examples are command-line scripts and demos
]
"tests/**/*.py" = [
    "D",       # docstrings not required in tests
    "FBT",     # tests intentionally cover boolean-typed tool parameters
    "PLC0415", # local imports keep test-only dependencies scoped
    "PLC2701", # allow private imports in tests
    "RUF029",  # async stubs/generators exercise async code paths
    "TC",      # test annotations often double as runtime documentation
]
